 <g class="label"><text x="1113" y="213">A</text><text x="1113" y="283">C</text><text x="1113" y="353">D</text><text x="1113" y="438">E</text></g>
 <use href="#trip" x="1182" y="192"/><rect x="1233" y="192" width="38" height="27" rx="3" fill="#efb14f" stroke="#9b6619"/><text x="1281" y="213" class="small">shift</text>
 <use href="#trip" x="1182" y="262"/><rect x="1233" y="262" width="38" height="27" rx="3" fill="#c9b5e6" stroke="#76549d"/><text x="1242" y="284" class="label">+</text><text x="1281" y="283" class="small">induced</text>
 <use href="#trip" x="1182" y="332"/><use href="#trip" x="1233" y="332"/><text x="1281" y="353" class="small">retained</text>
 <use href="#trip" x="1182" y="417"/><use href="#trip" x="1233" y="417"/><text x="1070" y="493" class="small">E: recruit a source non-user if needed</text>
 <text x="1070" y="526" class="small">Mode use can change within any row</text>
 <path d="M388 285H527" fill="none" stroke="#465954" stroke-width="3" marker-end="url(#arrow)"/>
 <g text-anchor="middle" class="small"><text x="457" y="218">REF totals</text><text x="457" y="245">Scope filters</text></g>
 <path d="M900 285H1037" fill="none" stroke="#465954" stroke-width="3" marker-end="url(#arrow)"/>
 <g text-anchor="middle" class="small"><text x="970" y="184" class="bold">Copy, then</text><text x="970" y="210" class="bold">sample changes</text><text x="970" y="330">CF targets</text><text x="970" y="358">Filters + weights</text><text x="970" y="386">People / trips</text></g>
 <path d="M203 572V615H1228V562" fill="none" stroke="#427aa7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
 <rect x="355" y="595" width="680" height="35" fill="white"/><text x="695" y="619" text-anchor="middle" class="label" fill="#427aa7">Wider source: additional eligible people and donor trip patterns</text>
 <text x="28" y="676" class="small">Each person symbol is one record. Small rectangles are linked trip records. Schematic counts only.</text>
 <text x="28" y="704" class="small">Recruitment expands the assessed CF subset, not the town's population. Reductions can remove mode use or active trips.</text>
</svg>
