 <text x="1050" y="43" class="title">CF copy + changes</text><text x="1050" y="76" class="sub">Travel with the intervention</text>
 <!-- Separate columns symbolize person records and their linked trip records. -->
 <rect x="28" y="112" width="350" height="449" rx="9" fill="#f5f7f6" stroke="#a4b6af" stroke-width="2"/>
 <rect x="540" y="112" width="350" height="347" rx="9" fill="#eff7f3" stroke="#08765c" stroke-width="3"/>
 <rect x="1050" y="112" width="362" height="437" rx="9" fill="#eff7f3" stroke="#08765c" stroke-width="3"/>
 <g class="small bold"><text x="48" y="150">Person</text><text x="158" y="150">Linked trips</text><text x="560" y="150">Person</text><text x="670" y="150">Linked trips</text><text x="1070" y="150">Person</text><text x="1180" y="150">Linked trips</text></g>
 <!-- Green source rows are the selected REF subset: A, C and D. -->
 <g fill="#d5ece1"><rect x="40" y="176" width="326" height="61" rx="4"/><rect x="40" y="316" width="326" height="61" rx="4"/><rect x="40" y="386" width="326" height="61" rx="4"/></g>
