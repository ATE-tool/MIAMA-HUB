 <g color="#80948c"><use href="#person" x="62" y="275"/><use href="#person" x="62" y="485"/></g>
 <g class="label"><text x="91" y="213">A</text><text x="91" y="283">B</text><text x="91" y="353">C</text><text x="91" y="423">D</text><text x="91" y="493">E</text></g>
 <g><use href="#trip" x="160" y="192"/><use href="#trip" x="211" y="192"/><use href="#trip" x="160" y="262"/><use href="#trip" x="211" y="262"/><use href="#trip" x="262" y="262"/><use href="#trip" x="160" y="332"/><use href="#trip" x="160" y="402"/><use href="#trip" x="211" y="402"/><use href="#trip" x="160" y="472"/><use href="#trip" x="211" y="472"/></g>
 <text x="48" y="542" class="small">Green rows form the REF subset</text>
 <g fill="#d5ece1"><rect x="552" y="176" width="326" height="61" rx="4"/><rect x="552" y="246" width="326" height="61" rx="4"/><rect x="552" y="316" width="326" height="61" rx="4"/></g>
 <g color="#08765c"><use href="#person" x="574" y="205"/><use href="#person" x="574" y="275"/><use href="#person" x="574" y="345"/></g>
 <g class="label"><text x="603" y="213">A</text><text x="603" y="283">C</text><text x="603" y="353">D</text></g>
 <g><use href="#trip" x="672" y="192"/><use href="#trip" x="723" y="192"/><use href="#trip" x="672" y="262"/><use href="#trip" x="672" y="332"/><use href="#trip" x="723" y="332"/></g>
 <text x="559" y="420" class="small">Select records, retain REF behaviour</text>
 <!-- CF keeps REF identities. Highlight a switch, an induced trip and recruitment. -->
 <g fill="#d5ece1"><rect x="1062" y="176" width="338" height="61" rx="4"/><rect x="1062" y="246" width="338" height="61" rx="4"/><rect x="1062" y="316" width="338" height="61" rx="4"/></g>
 <rect x="1062" y="401" width="338" height="61" rx="4" fill="#eef3fb" stroke="#427aa7" stroke-width="2" stroke-dasharray="7 4"/>
