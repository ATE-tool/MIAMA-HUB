<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
 <defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#465954" stroke-width="1.5"/></marker>
  <g id="person"><circle cx="0" cy="-8" r="6" fill="currentColor"/><path d="M-10 12v-7a10 10 0 0 1 20 0v7z" fill="currentColor"/></g>
  <g id="trip"><rect width="38" height="27" rx="3" fill="#dce5e2" stroke="#759088"/><path d="M8 13h20m-5-5 5 5-5 5" fill="none" stroke="#465954" stroke-width="2"/></g>
  <style>text{font-family:Arial,sans-serif;fill:#263f38} .title{font-size:29px;font-weight:700}.sub{font-size:21px;fill:#586b65}.label{font-size:23px}.small{font-size:19px}.bold{font-weight:700}</style>
 </defs>
 <rect width="1440" height="720" fill="white"/>
 <text x="28" y="43" class="title">Geographic source</text><text x="28" y="76" class="sub">People and their linked trip rows</text>
